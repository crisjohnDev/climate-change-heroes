{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'image/gameLogo.png' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'image/gameLogo.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'image/gameLogo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #f8fafc;
            --surface: #ffffff;
            --surface-subtle: #f1f5f9;
            --primary: #059669;
            --primary-hover: #047857;
            --primary-light: #ecfdf5;
            --primary-border: #a7f3d0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -4px rgba(0,0,0,0.05);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER */
        .top-header {
            height: 72px;
            background: var(--surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .brand-text h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .brand-text span {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .teacher-info {
            text-align: right;
        }

        .teacher-info strong {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .teacher-info span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .logout-button {
            border: 1px solid var(--border-color);
            background: var(--surface);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .logout-button:hover {
            background: var(--danger-light);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        /* DASHBOARD LAYOUT */
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* STATS */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 36px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--surface-subtle);
        }

        .stat-card:hover::before {
            background: var(--primary);
        }

        .stat-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1;
        }

        /* ACTIONS */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 16px;
            letter-spacing: -0.01em;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .action-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .action-card:hover {
            border-color: var(--primary-border);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .action-card h3 {
            color: var(--text-main);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .action-card p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .action-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
        }

        .action-card:hover .action-link {
            color: var(--primary-hover);
        }

        /* RECENT STUDENTS TABLE */
        .students-section {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-sm);
        }

        .students-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .students-header h2 {
            color: var(--text-main);
            font-size: 18px;
            font-weight: 700;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            background: var(--bg-base);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }

        th:first-child {
            border-top-left-radius: var(--radius-sm);
            border-bottom-left-radius: var(--radius-sm);
        }

        th:last-child {
            border-top-right-radius: var(--radius-sm);
            border-bottom-right-radius: var(--radius-sm);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .student-name {
            font-weight: 600;
            color: var(--text-main);
        }

        .score-badge {
            display: inline-block;
            font-weight: 600;
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-muted);
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* RESPONSIVE */
        @media (max-width: 800px) {
            .stats, .actions {
                grid-template-columns: 1fr;
            }

            .top-header {
                padding: 0 20px;
            }

            .teacher-info {
                display: none;
            }
        }

        @media (max-width: 500px) {
            .dashboard {
                padding: 24px 16px 40px;
            }

            .page-header h1 {
                font-size: 22px;
            }

            .brand-text {
                display: none;
            }

            .students-section {
                padding: 20px 16px;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header class="top-header">
    <div class="brand">
        <img src="{% static 'image/gameLogo.png' %}" alt="Logo">
        <div class="brand-text">
            <h2>Learning Game</h2>
            <span>Teacher Portal</span>
        </div>
    </div>

    <div class="user-area">
        <div class="teacher-info">
            <strong>{{ request.user.get_full_name|default:request.user.username }}</strong>
            <span>Teacher</span>
        </div>

        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="logout-button">
                Logout
            </button>
        </form>
    </div>
</header>

<!-- MAIN CONTENT -->
<main class="dashboard">
    {% block content %}{% endblock %}

</main>

</body>
</html>
